<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="a.css">
    <title>Document</title>
</head>
<body>
    <nav>
        <i class="fa-solid fa-x exit"></i>
        <h1>Dashboard</h1>
        <ul class="menu">
            <li><a href="">Dashboard</a></li>
            <li><a href="">User</a></li>
            <li><a href="">Products</a></li>
            <li><a href="">Orders</a></li>
            <li><a href="">Analytics</a></li>
            <li><a href="">Settings</a></li>
        </ul>

    </nav>
    <main>
        <div class="navbar">
            <div class="leftside">
                <i class="fa-solid fa-bars btn"></i>
                <h1>Dashboard</h1>
            </div>
            <div class="rightside">
                <div class="profile"></div>
                <h2>Admin</h2>
            </div>
            
        </div>
        <div class="boxes">
            <div class="box">
                <h2>User</h2>
                <h1>1,240</h1>
            </div>
            <div class="box">
                <h2>Order</h2>
                <h1>50</h1>
            </div>
            <div class="box">
                <h2>Revenue</h2>
                <h1>₱20,213</h1>
            </div>
            <div class="box">
                <h2>Product</h2>
                <h1>1,240</h1>
            </div>
        </div>
        <div class="orders">
            <h1>Recent Orders</h1>

            <table>
                <tr>
                    <th>Order</th>
                    <th>Costumer</th>
                    <th>Status</th>
                </tr>
                <tr>
                    <td>#1</td>
                    <td>John</td>
                    <td>Completed</td>
                </tr>
                <tr>
                    <td>#2</td>
                    <td>Maria</td>
                    <td>Pending</td>
                </tr>
                <tr>
                    <td>#3</td>
                    <td>Jai</td>
                    <td>To Ship</td>
                </tr>
            </table>
        </div>
    </main>
    <script src="a.js"></script>
</body>
</html>
