<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .image{
            width: 80%;
            margin: 100px auto 50px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            grid-gap: 50px;
        }

        .image img{
            width: 100%;
            height: 100%;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 0 15px black;
            transition: all .5s ease;
        }
        .image img:hover{
            transform: scale(0.8) rotate(-20deg);
        }
        .fullImage{
            background-color: rgba(0,0,0,0.8);
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            right: 0;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .fullImage img{
            width: 70%;
        }
        .fullImage span{
            position: absolute;
            top: 5%;
            right: 5%;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="image">
        <img src="https://thfvnext.bing.com/th/id/OIP.QlOpqqvyGfozP0rV76Jy3QHaEK?o=7&cb=thfvnextrm=3&rs=1&pid=ImgDetMain&o=7&rm=3" onclick="openImg(this.src)">
        <img src="https://png.pngtree.com/thumb_back/fh260/background/20240527/pngtree-autumn-fog-and-the-beautiful-morning-sun-in-a-landscape-image_15732972.jpg" onclick="openImg(this.src)">
        <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/morning-fog-beautiful-nature-scenery-free-photo.jpg?w=1500&quality=50" onclick="openImg(this.src)">
        <img src="https://thfvnext.bing.com/th/id/OIP.zB1rsS80G2GPbY0mMvKnigHaEK?o=7&cb=thfvnextrm=3&rs=1&pid=ImgDetMain&o=7&rm=3" onclick="openImg(this.src)">
        <img src="https://static.vecteezy.com/system/resources/previews/040/692/510/non_2x/ai-generated-tranquil-meadow-green-trees-sunset-sky-nature-serene-beauty-generated-by-ai-free-photo.jpg" onclick="openImg(this.src)">
        <img src="https://eskipaper.com/images/beautiful-morning-fog-wallpaper-1.jpg" onclick="openImg(this.src)">
        <img src="https://c.pxhere.com/photos/6a/74/light_morning_mist_sunbeam_fog_sunrise_mood_autumn_morgenstimmung-413383.jpg!d" onclick="openImg(this.src)">
        <img src="https://wallup.net/wp-content/uploads/2019/09/1027686-morning-fog-in-the-beautiful-landscape.jpg" onclick="openImg(this.src)">
    </div>
    <div class="fullImage" id="fullImage">
        <img src="https://thfvnext.bing.com/th/id/OIP.QlOpqqvyGfozP0rV76Jy3QHaEK?o=7&cb=thfvnextrm=3&rs=1&pid=ImgDetMain&o=7&rm=3" id="image">
        <span onclick="closeImg()"><i class="fa-solid fa-x"></i></span>
    </div>


    <script>
        const full = document.getElementById('fullImage');
        const img = document.getElementById('image')

        function openImg(val){
            full.style.display = 'flex';
            img.src = val;
        }
        function closeImg(){
            full.style.display = "none";
        }
    </script>
</body>
</html>
