<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: rgb(47, 45, 45);
            color: white;
        }

        .profile{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .card{
            background-color: rgb(83, 81, 81);
            border: 2px solid white;
            padding: 20vh 10vh;
            border-radius: 10px;
            transition: .5s;
        }
        .card:hover{
            scale: .9;
        }
        .card .card-info{
            margin: 20px;
            display: flex;
        }
        .info {
            display: flex;
            flex-direction: column;

        }
        .info .mation{
            display: flex;
            flex-direction: column;
            font-size: 1.5rem;
        }
        .info .mation input{
            font-size: 1.6rem;
            padding: .5rem;
            width: 50vh
        }

        .info .mation .bio{
            padding: .5rem;
            font-size: 1.6rem;
            background-color: rgb(83, 81, 81);
            color: white;
            border: 2px solid white;
            border-radius: 10px;
        }
        .icon{
            padding: 1rem;
            font-size: 1.5rem;
        }
        button{
            font-size: 2rem;
            width: 3rem;
            height: 3rem;
        }
        @media (max-width: 900px) {
            .profile{
                display: flex;
                flex-direction: column;
            }
            .card{
                margin: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="profile">
        <div class="card">
            <div class="card-info">
                <div class="icon">
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <div class="text">
                    <h4>Email</h4>
                    <h3>jane@example.com</h3>
                </div>
            </div>
            <div class="card-info">
                <div class="icon">
                    <i class="fa-brands fa-github"></i>
                </div>
                <div class="text">
                    <h4>GitHub</h4>
                    <h3>github.com/janedoe</h3>
                </div>
            </div>
            <div class="card-info">
                <div class="icon">
                    <i class="fa-solid fa-location-arrow"></i>
                </div>
                <div class="text">
                    <h4>Location</h4>
                    <h3>Manila, PH</h3>
                </div>
                
            </div>
        </div>
        <div class="info">
            <div class="mation">
                <label>Name</label>
                <input class="bio" value="Jairus Aldred Mindoro">
            </div>
            <div class="mation">
                <label>Role</label>
                <input class="bio" value="Frontend Developer">
            </div>
            <div class="mation">
                <label>Bio</label>
                <textarea class="bio"  rows="3">I love building beautiful UIs and learning new CSS tricks every day.</textarea>
            </div>
            <div class="mation">
                <label>Email</label>
                <input class="bio" value="jai@example.com">
            </div>
            <div class="mation">
                <label>Github</label>
                <input class="bio" value="github.com/jairus">
            <div class="mation">
                <label>Location</label>
                <input class="bio" value="Manila, PH">
            </div>
            <div class="mation">
                <label>skills</label>
                <input class="bio" placeholder="e.g. CSS">
                <button class="bio">+</button>
            </div>
        </div>
    </div>
    <script>
        const card = document.querySelector('.card');

        card.addEventListener("click", ()=>{
            
        })
    </script>
</body>
</html>
