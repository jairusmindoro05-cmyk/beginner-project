<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 50%, #00b894 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .weather-app {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: all 0.3s ease;
        }

        .weather-app:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .search-box {
            margin-bottom: 30px;
        }

        .search-input {
            width: 80%;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .search-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #00b894, #00cec9);
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 184, 148, 0.4);
        }

        .location-info {
            margin-bottom: 20px;
        }

        .city-name {
            font-size: 28px;
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .date-time {
            color: #636e72;
            font-size: 14px;
        }

        .weather-main {
            margin: 30px 0;
        }

        .temperature {
            font-size: 64px;
            font-weight: 300;
            color: #2d3436;
            margin-bottom: 10px;
        }

        .weather-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .weather-description {
            font-size: 20px;
            color: #636e72;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-3px);
        }

        .detail-icon {
            font-size: 24px;
            color: #00b894;
            margin-bottom: 5px;
        }

        .detail-label {
            font-size: 12px;
            color: #636e72;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: #2d3436;
        }

        .loading {
            display: none;
            font-size: 18px;
            color: #00b894;
        }

        .error {
            color: #e17055;
            font-size: 16px;
            margin-top: 20px;
            display: none;
        }

        @media (max-width: 480px) {
            .weather-app {
                padding: 20px;
            }
            
            .temperature {
                font-size: 48px;
            }
            
            .weather-icon {
                font-size: 60px;
            }
            
            .search-input {
                width: 70%;
            }
        }
    </style>
</head>
<body>
    <div class="weather-app">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Enter city name...">
            <button class="search-btn" onclick="getWeather()">
                <i class="fas fa-search"></i>
            </button>
        </div>
        
        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i> Getting weather...
        </div>
        
        <div class="error" id="error"></div>
        
        <div id="weatherContainer">
            <div class="location-info">
                <div class="city-name" id="cityName">Your Location</div>
                <div class="date-time" id="dateTime"></div>
            </div>
            
            <div class="weather-main">
                <div class="weather-icon" id="weatherIcon">
                    <i class="fas fa-sun"></i>
                </div>
                <div class="temperature" id="temperature">--°C</div>
                <div class="weather-description" id="weatherDesc">Loading...</div>
            </div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <div class="detail-icon"><i class="fas fa-thermometer-half"></i></div>
                    <div class="detail-label">Feels Like</div>
                    <div class="detail-value" id="feelsLike">--°C</div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon"><i class="fas fa-tint"></i></div>
                    <div class="detail-label">Humidity</div>
                    <div class="detail-value" id="humidity">--%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon"><i class="fas fa-wind"></i></div>
                    <div class="detail-label">Wind</div>
                    <div class="detail-value" id="wind">-- km/h</div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon"><i class="fas fa-eye"></i></div>
                    <div class="detail-label">Visibility</div>
                    <div class="detail-value" id="visibility">-- km</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'YOUR_API_KEY_HERE'; 
        
        
        const USE_OPEN_METEO = true;

        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            document.getElementById('dateTime').textContent = now.toLocaleDateString('en-US', options);
        }

        async function getWeather(city = 'London') {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const container = document.getElementById('weatherContainer');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            container.style.display = 'none';

            try {
                let weatherData;
                
                if (USE_OPEN_METEO) {
                    
                    const searchInput = document.getElementById('searchInput').value || city;
                    const geoResponse = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${searchInput}`);
                    const geoData = await geoResponse.json();
                    
                    if (geoData.results && geoData.results.length > 0) {
                        const { latitude, longitude } = geoData.results[0];
                        const weatherResponse = await fetch(
                            `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,precipitation&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
                        );
                        weatherData = await weatherResponse.json();
                    } else {
                        throw new Error('City not found');
                    }
                } else {
                    
                    const response = await fetch(
                        `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`
                    );
                    if (!response.ok) throw new Error('City not found');
                    weatherData = await response.json();
                }

                displayWeather(weatherData);
            } catch (err) {
                error.textContent = err.message || 'Something went wrong!';
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }

        function displayWeather(data) {
            if (USE_OPEN_METEO) {
                const current = data.current_weather;
                const daily = data.daily;
                
                document.getElementById('cityName').textContent = document.getElementById('searchInput').value || 'Current Location';
                document.getElementById('temperature').textContent = `${Math.round(current.temperature)}°C`;
                document.getElementById('weatherDesc').textContent = getWeatherDescription(current.temperature);
                document.getElementById('feelsLike').textContent = `${Math.round(current.temperature)}°C`;
                document.getElementById('humidity').textContent = `${data.hourly.relativehumidity_2m[0]}%`;
                document.getElementById('wind').textContent = `${Math.round(current.windspeed)} km/h`;
                document.getElementById('visibility').textContent = '>10 km';
                
                updateWeatherIcon(current.temperature);
            } else {
                document.getElementById('cityName').textContent = data.name;
                document.getElementById('temperature').textContent = `${Math.round(data.main.temp)}°C`;
                document.getElementById('weatherDesc').textContent = data.weather[0].description;
                document.getElementById('feelsLike').textContent = `${Math.round(data.main.feels_like)}°C`;
                document.getElementById('humidity').textContent = `${data.main.humidity}%`;
                document.getElementById('wind').textContent = `${Math.round(data.wind.speed * 3.6)} km/h`;
                document.getElementById('visibility').textContent = `${(data.visibility / 1000).toFixed(1)} km`;
                
                updateWeatherIcon(data.weather[0].main);
            }
            
            document.getElementById('weatherContainer').style.display = 'block';
        }

        function updateWeatherIcon(condition) {
            const icon = document.getElementById('weatherIcon');
            if (USE_OPEN_METEO) {
                if (condition < 0) {
                    icon.innerHTML = '<i class="fas fa-snowflake"></i>';
                } else if (condition < 10) {
                    icon.innerHTML = '<i class="fas fa-cloud-sun"></i>';
                } else if (condition < 20) {
                    icon.innerHTML = '<i class="fas fa-cloud-sun-rain"></i>';
                } else if (condition < 30) {
                    icon.innerHTML = '<i class="fas fa-cloud-rain"></i>';
                } else {
                    icon.innerHTML = '<i class="fas fa-sun"></i>';
                }
            } else {
                const icons = {
                    'Clear': 'fas fa-sun',
                    'Clouds': 'fas fa-cloud',
                    'Rain': 'fas fa-cloud-rain',
                    'Drizzle': 'fas fa-cloud-drizzle',
                    'Thunderstorm': 'fas fa-bolt',
                    'Snow': 'fas fa-snowflake',
                    'Mist': 'fas fa-smog'
                };
                icon.innerHTML = `<i class="${icons[condition] || 'fas fa-cloud'}"></i>`;
            }
        }

        function getWeatherDescription(temp) {
            if (temp < 0) return 'Freezing cold';
            if (temp < 10) return 'Very cold';
            if (temp < 20) return 'Cold';
            if (temp < 30) return 'Pleasant';
            if (temp < 40) return 'Hot';
            return 'Very hot';
        }

        
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getWeather();
            }
        });

        updateDateTime();
        setInterval(updateDateTime, 60000); 
        getWeather(); 
    </script>
</body>
</html>
