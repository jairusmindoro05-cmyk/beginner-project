<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @media (max-width: 800px) {
            *{
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }
            body{
                background-color: white;
            }
            .con{
                border: 1px solid black;
                display: flex;
                padding: 1rem;
                justify-content: center;

            }
            .con button{
                padding: 1rem;
                border-radius: 10px;
            }
            .con .projs{
                display: none;
                flex-direction: column;
                position: absolute;
                width: 100%;
                height: 100vh;
                top: 10%;
            }
            img{
                width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="con">
        <h1>Projects 1</h1>
        <button id="open">Open</button>
        <div class="projs">
            <h1>project1</h1>
            <img src="pics/TechFlow.png" alt="">
        </div>

    </div>

    <script>
        const opened = document.getElementById('open');
        const proj = document.querySelector('.projs');

        let act = false;

        opened.addEventListener('click', () => {
            if(!act){
                proj.style.display = "flex";
                proj.style.height = "200px";
                opened.textContent = 'Close';
                act = true;
            }else{
                proj.style = 'none';
                opened.textContent = 'Open';

                act = false;
            }
        })
    

    </script>
</body>
</html>
